<nav class="rail">
  <div class="rail__top-btn" title="Thực đơn">
    <span class="rail__top-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="4" y="4" width="16" height="16" rx="3" />
        <path d="M12 9v6M9 12h6" stroke-linecap="round" />
      </svg>
    </span>
  </div>

  <ul class="rail__list">
    @for (item of items; track item.label + $index) {
      <li class="rail__item" [class.rail__item--active]="item.active">
        <span class="rail__icon" ></span>
        <span class="rail__label" [title]="item.label">{{ item.label }}</span>
      </li>
    }
  </ul>

  <div class="rail__logout" title="Đăng xuất">
    <span class="rail__icon" ></span>
    <span class="rail__label">Đăng xuất</span>
  </div>
</nav>
