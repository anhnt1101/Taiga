<header class="header">
  <div class="header__spacer"></div>

  <button class="header__bell" type="button" aria-label="Thông báo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
      <path d="M6 9a6 6 0 1 1 12 0c0 3.4 1 5 1.5 6H4.5C5 14 6 12.4 6 9Z" />
      <path d="M10 19a2 2 0 0 0 4 0" />
    </svg>
    <span class="header__bell-dot">6+</span>
  </button>

  <div class="header__lang">
    <span>VIE</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M6 9l6 6 6-6" />
    </svg>
  </div>

  <div class="header__user">
    <div class="header__avatar">HT</div>
    <div class="header__user-info">
      <span class="header__user-name">Hoàng Văn Thuận</span>
      <span class="header__user-role">Chuyên viên</span>
    </div>
  </div>
</header>
