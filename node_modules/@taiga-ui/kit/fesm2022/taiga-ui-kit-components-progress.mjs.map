<progress
    class="t-hidden"
    [max]="max()"
    [value]="value()"
></progress>

<svg
    aria-hidden="true"
    height="100%"
    width="100%"
    class="t-svg"
>
    <circle
        cx="50%"
        cy="50%"
        class="t-track"
    />

    <circle
        cx="50%"
        cy="50%"
        class="t-progress"
    />
</svg>
